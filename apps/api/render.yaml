# Render Blueprint for the CalibrAI API and its PostgreSQL database.
# In Render: New > Blueprint, pick this repository and set the Blueprint path to apps/api/render.yaml.
# Every variable is documented in docs/DEPLOY.md. Values marked `sync: false` are entered in the
# Render dashboard when the Blueprint is created; they are never committed.
# Plans are left to their defaults: choose them in the dashboard.

services:
  - type: web
    name: calibrai-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Same command as the Procfile: migrate, then serve. One worker: the rate limiter is per process.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.5"
      - key: CALIBRAI_ENVIRONMENT
        value: production
      - key: CALIBRAI_DATABASE_URL
        fromDatabase:
          name: calibrai-db
          property: connectionString
      # Secrets generated by Render (random, 256-bit).
      - key: CALIBRAI_SESSION_SIGNING_SECRET
        generateValue: true
      - key: CALIBRAI_ENROLLMENT_SECRET
        generateValue: true
      # Signal engine.
      - key: CALIBRAI_SIGNAL_PROVIDER
        value: selfconsistency
      - key: LLM_API_KEY
        sync: false
      - key: CALIBRAI_LLM_MODEL
        value: claude-haiku-5-5
      - key: CALIBRAI_LLM_EXTRACTION_MODEL
        sync: false # optional; leave empty to use CALIBRAI_LLM_MODEL
      # Consent and the study harness.
      - key: CALIBRAI_CONSENT_VERSION
        value: "2026-11-04"
      - key: CALIBRAI_STUDY_ENROLLMENT_CODE
        sync: false # 12+ characters, different from CALIBRAI_ENROLLMENT_SECRET; empty = enrollment closed
      - key: CALIBRAI_STUDY_ORIGINS
        sync: false # the harness URL, e.g. https://calibrai-study.vercel.app
      # CORS for the extension: chrome-extension://<extension id> (see docs/DEPLOY.md).
      - key: CALIBRAI_API_ORIGINS
        sync: false

databases:
  - name: calibrai-db
    databaseName: calibrai
    user: calibrai
